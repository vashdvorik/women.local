<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-hidden="true">
  <!-- Иллюстрация личного кабинета: окно с боковым меню, карточкой подбора контактов и списком участниц. Без реальных данных. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1E3DA"/>
      <stop offset="1" stop-color="#FAF4F1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#21140F" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- Фон: фирменные круги -->
  <rect width="640" height="460" rx="32" fill="url(#bg)"/>
  <circle cx="560" cy="70" r="92" fill="#E6CFC1" opacity=".55"/>
  <circle cx="610" cy="150" r="46" fill="#FFFFFF" opacity=".7"/>
  <circle cx="64" cy="404" r="58" fill="#E6CFC1" opacity=".5"/>
  <circle cx="108" cy="372" r="16" fill="#C5A895" opacity=".7"/>

  <!-- Окно кабинета -->
  <g filter="url(#shadow)">
    <rect x="56" y="52" width="528" height="356" rx="22" fill="#FFFFFF"/>
  </g>
  <rect x="56" y="52" width="528" height="40" rx="22" fill="#2A1913"/>
  <rect x="56" y="70" width="528" height="22" fill="#2A1913"/>
  <circle cx="84" cy="72" r="5" fill="#E6CFC1"/>
  <circle cx="102" cy="72" r="5" fill="#C5A895"/>
  <circle cx="120" cy="72" r="5" fill="#74472F"/>

  <!-- Боковое меню -->
  <rect x="56" y="92" width="136" height="316" fill="#FAF4F1"/>
  <rect x="72" y="108" width="72" height="16" rx="8" fill="#2A1913"/>
  <rect x="72" y="146" width="104" height="30" rx="10" fill="#F1E3DA"/>
  <circle cx="88" cy="161" r="6" fill="#74472F"/>
  <rect x="102" y="157" width="58" height="8" rx="4" fill="#74472F"/>
  <g fill="#C5A895">
    <circle cx="88" cy="199" r="6"/><rect x="102" y="195" width="52" height="8" rx="4"/>
    <circle cx="88" cy="231" r="6"/><rect x="102" y="227" width="62" height="8" rx="4"/>
    <circle cx="88" cy="263" r="6"/><rect x="102" y="259" width="46" height="8" rx="4"/>
    <circle cx="88" cy="295" r="6"/><rect x="102" y="291" width="56" height="8" rx="4"/>
    <circle cx="88" cy="327" r="6"/><rect x="102" y="323" width="44" height="8" rx="4"/>
  </g>

  <!-- Заголовок и карточка подбора контактов -->
  <rect x="216" y="112" width="120" height="14" rx="7" fill="#2A1913"/>
  <rect x="216" y="134" width="190" height="8" rx="4" fill="#E6CFC1"/>

  <rect x="216" y="162" width="338" height="104" rx="18" fill="#FAF4F1"/>
  <rect x="232" y="178" width="64" height="20" rx="10" fill="#2A1913"/>
  <rect x="244" y="185" width="40" height="6" rx="3" fill="#FFFFFF"/>
  <rect x="232" y="210" width="150" height="12" rx="6" fill="#2A1913"/>
  <rect x="232" y="232" width="206" height="8" rx="4" fill="#C5A895"/>
  <rect x="232" y="248" width="206" height="8" rx="4" fill="#E6CFC1"/>
  <rect x="232" y="248" width="150" height="8" rx="4" fill="#74472F"/>
  <!-- Три аватара -->
  <g>
    <circle cx="500" cy="196" r="18" fill="#E6CFC1"/>
    <circle cx="500" cy="190" r="6" fill="#74472F"/>
    <path d="M488 208c2-6 6-8 12-8s10 2 12 8" fill="#74472F"/>
    <circle cx="522" cy="214" r="14" fill="#F1E3DA" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="522" cy="210" r="5" fill="#C5A895"/>
    <path d="M513 222c1.5-4.5 4.5-6 9-6s7.5 1.5 9 6" fill="#C5A895"/>
    <circle cx="474" cy="214" r="14" fill="#F1E3DA" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="474" cy="210" r="5" fill="#2A1913"/>
    <path d="M465 222c1.5-4.5 4.5-6 9-6s7.5 1.5 9 6" fill="#2A1913"/>
  </g>

  <!-- Список участниц -->
  <g>
    <rect x="216" y="284" width="338" height="36" rx="12" fill="#FFFFFF" stroke="#F2E8E3"/>
    <circle cx="238" cy="302" r="10" fill="#E6CFC1"/>
    <rect x="258" y="294" width="84" height="8" rx="4" fill="#2A1913"/>
    <rect x="258" y="308" width="140" height="6" rx="3" fill="#C5A895"/>
    <rect x="496" y="293" width="44" height="18" rx="9" fill="#F1E3DA"/>

    <rect x="216" y="328" width="338" height="36" rx="12" fill="#FFFFFF" stroke="#F2E8E3"/>
    <circle cx="238" cy="346" r="10" fill="#C5A895"/>
    <rect x="258" y="338" width="96" height="8" rx="4" fill="#2A1913"/>
    <rect x="258" y="352" width="120" height="6" rx="3" fill="#C5A895"/>
    <rect x="496" y="337" width="44" height="18" rx="9" fill="#F1E3DA"/>

    <rect x="216" y="372" width="338" height="26" rx="12" fill="#FFFFFF" stroke="#F2E8E3"/>
    <circle cx="238" cy="385" r="7" fill="#F1E3DA"/>
    <rect x="256" y="381" width="110" height="8" rx="4" fill="#2A1913" opacity=".7"/>
  </g>

  <!-- Сообщение в Telegram -->
  <g filter="url(#shadow)">
    <rect x="430" y="344" width="170" height="64" rx="18" fill="#2A1913"/>
  </g>
  <circle cx="458" cy="376" r="14" fill="#F1E3DA"/>
  <path d="M451 376l14-6-4 13-4-4-3 3-1-5Z" fill="#74472F"/>
  <rect x="480" y="364" width="96" height="9" rx="4.5" fill="#FFFFFF"/>
  <rect x="480" y="381" width="68" height="7" rx="3.5" fill="#C5A895"/>
</svg>
